<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zinsight - PoC Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f8;
        }

        @media print {
            .no-print {
                display: none !important;
            }
        }

        /* ... existing styles ... */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ... */
        .refresh-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
            margin-left: 10px;
        }

        .pdf-btn {
            background: #FF5722;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .pdf-btn:hover {
            background: #E64A19;
        }

        /* ... */
    </style>
</head>

<body>
    <div class="container" id="dashboard-content">
        <header>
            <h1>zinsight PoC Dashboard</h1>
            <p>Participants Scouting Agent for LED Exhibition</p>
        </header>

        <div class="section">
            <button class="refresh-btn no-print" onclick="refreshData()">Refresh Data</button>
            <button class="pdf-btn no-print" onclick="downloadPDF()">📄 Save as PDF</button>
            <h2>📊 Market Trend</h2>
            <h2>📊 Market Trend</h2>
            <div id="trend" class="trend-box">
                Loading trend...
            </div>
        </div>

        <div class="section">
            <h2>🏢 Promising Companies List</h2>
            <table id="companyTable">
                <thead>
                    <tr>
                        <th style="width: 10%">Score/Type</th>
                        <th style="width: 20%">Candidate (Category)</th>
                        <th style="width: 40%">Keywords / Description</th>
                        <th style="width: 20%">Tags & Source</th>
                        <th style="width: 10%">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Render Trend
                const trendDiv = document.getElementById('trend');
                if (data.trends.length > 0) {
                    const latest = data.trends[data.trends.length - 1];
                    trendDiv.innerHTML = `<strong>${latest.trend_summary}</strong><br><small>${latest.evidence}</small>`;
                } else {
                    trendDiv.innerHTML = "No trend data generated yet.";
                }

                // Render Companies
                const tbody = document.querySelector('#companyTable tbody');
                tbody.innerHTML = '';
                // Sort by exhibition_score desc
                data.companies.sort((a, b) => (b.exhibition_score || 0) - (a.exhibition_score || 0));

                data.companies.forEach(company => {
                    const tr = document.createElement('tr');

                    // Score & Type Badge
                    const score = company.exhibition_score || 0;
                    const scoreColor = score >= 10 ? '#4caf50' : (score > 0 ? '#ff9800' : '#9e9e9e');
                    const scoreBadge = `<div class="badge" style="background:${scoreColor}; color:white; margin-bottom: 4px;">Score: ${score}</div>`;

                    const typeColorMap = {
                        'SME': '#E3F2FD', // Blue
                        'Public': '#E8F5E9', // Green
                        'Association': '#FFF3E0', // Orange
                        'Large': '#F3E5F5', // Purple
                        'Other': '#ECEFF1'  // Grey
                    };
                    const typeColor = typeColorMap[company.entity_type] || '#ECEFF1';
                    const typeBadge = `<div class="badge" style="background:${typeColor}; color:#333">${company.entity_type || 'Unknown'}</div>`;

                    // Tags
                    const tags = (company.category_tags || []).slice(0, 5).map(t => `<span class="badge" style="margin-right:2px">${t}</span>`).join('');

                    // Source Link Logic
                    let sourceLink = '-';
                    if (company.source_articles && company.source_articles.length > 0) {
                        const articleId = company.source_articles[0];
                        const article = data.news.find(n => n.id === articleId);
                        if (article) {
                            sourceLink = `<a href="${article.source_url}" target="_blank" style="color: #0047AB; text-decoration: none; font-size: 13px;">🔗 View Source</a>`;
                        }
                    }
                    const sourceQuery = `<div style="font-size: 11px; color: #666; margin-top: 4px;">Found by: ${company.source_query || '-'}</div>`;

                    tr.innerHTML = `
                        <td>
                            ${scoreBadge}
                            ${typeBadge}
                        </td>
                        <td>
                            <strong>${company.name}</strong><br>
                            <span style="font-size: 12px; color: #555">Category: ${company.primary_category || '-'}</span>
                        </td>
                        <td>
                            <div style="font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #0277BD;">${company.keywords ? company.keywords.join(', ') : '-'}</div>
                            <div style="font-size: 12px; color: #333;">${company.description || '-'}</div>
                        </td>
                        <td>
                            <div style="margin-bottom: 5px;">${tags}</div>
                            ${sourceQuery}
                        </td>
                        <td>
                             ${sourceLink}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading data:", error);
                const tbody = document.querySelector('#companyTable tbody');
                tbody.innerHTML = `<tr><td colspan="5" style="color:red">Error loading data. Ensure server is running.</td></tr>`;
            }
        }

        async function refreshData() {
            if (confirm("Refresh data from Naver API?")) {
                await fetch('/api/refresh');
                loadData();
            }
        }

        function downloadPDF() {
            const element = document.getElementById('dashboard-content');
            const opt = {
                margin: 10,
                filename: 'MICE_Scout_Report.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Temporarily hide buttons manually if CSS media query fails in canvas
            const buttons = document.querySelectorAll('.no-print');
            buttons.forEach(b => b.style.display = 'none');

            html2pdf().set(opt).from(element).save().then(() => {
                // Restore buttons
                buttons.forEach(b => b.style.display = 'block');
            });
        }

        // Initial load
        loadData();
    </script>
</body>

</html>
